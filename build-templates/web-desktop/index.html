<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Slot Game</title>
    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,minimal-ui=true"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="full-screen" content="yes"/>
    <meta name="screen-orientation" content="portrait"/>
    <meta name="x5-fullscreen" content="true"/>
    <meta name="360-fullscreen" content="true"/>
    <meta name="renderer" content="webkit"/>
    <meta name="force-rendering" content="webkit"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <link rel="stylesheet" type="text/css" href="./style.css"/>
    <link rel="icon" href="favicon.ico"/>
  </head>
  <body>
    <div id="GameDiv" cc_exact_fit_screen="true">
      <div id="Cocos3dGameContainer">
        <canvas id="GameCanvas" width="1280" height="960" tabindex="99"></canvas>
      </div>
    </div>
    <script>
      // 16:9 等比縮放：瀏覽器寬高比 <= 16:9 時遊戲寬 = 瀏覽器寬，否則遊戲高 = 瀏覽器高。
      // 尺寸必須寫在 GameDiv 的 inline style：引擎只在 inline style 改變時才發出 window-resize，
      // 否則縮放視窗後 view 的縮放比例不會更新，按鈕點擊範圍會停在舊位置。
      // 此監聽器須早於引擎註冊，才能在引擎處理 resize 前先更新尺寸。
      (function () {
        var gameDiv = document.getElementById('GameDiv');
        function fitGameDiv() {
          var winW = window.innerWidth;
          var winH = window.innerHeight;
          var w, h;
          if (winW / winH <= 16 / 9) {
            w = winW;
            h = Math.floor(winW * 9 / 16);
          } else {
            h = winH;
            w = Math.floor(winH * 16 / 9);
          }
          gameDiv.style.width = w + 'px';
          gameDiv.style.height = h + 'px';
        }
        fitGameDiv();
        window.addEventListener('resize', fitGameDiv);
      })();
    </script>
    <!-- Polyfills bundle. -->
    <script src="src/polyfills.bundle.js" charset="utf-8"> </script>    
    <!-- SystemJS support. -->
    <script src="src/system.bundle.js" charset="utf-8"> </script>
    <!-- Import map -->
    <script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"> </script>
    <script>
      System.import('./index.js').catch(function(err) { console.error(err); })
    </script>
  </body>
</html>
